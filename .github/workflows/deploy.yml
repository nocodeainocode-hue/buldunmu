name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd /var/www/firmarehberi
            git pull origin main
            composer install --no-dev --optimize-autoloader
            npm ci
            npm run build
            php artisan migrate --force
            php artisan db:seed --class=RegistrationArticlesSeeder --force
            php artisan db:seed --class=DirectoryArticlesOctober2026Seeder --force
            php artisan db:seed --class=DirectoryMarketingArticlesSeeder --force
            php artisan db:seed --class=LongFormMarketingArticlesSeeder --force
            php artisan directories:install-branding --apply
            php artisan optimize:clear
            php artisan filament:optimize
            php artisan storage:link
            chown -R www-data:www-data storage bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            rm -rf storage/framework/views/*
            PHP_BIN="$(command -v php)"
            printf '* * * * * www-data cd /var/www/firmarehberi && %s artisan schedule:run >> /dev/null 2>&1\n' "$PHP_BIN" > /etc/cron.d/firmarehberi-schedule
            chmod 0644 /etc/cron.d/firmarehberi-schedule
            if crontab -l 2>/dev/null | grep -Fq 'cd /var/www/firmarehberi && /usr/bin/php artisan schedule:run'; then
              crontab -l | grep -Fv 'cd /var/www/firmarehberi && /usr/bin/php artisan schedule:run' | crontab -
            fi
